{% extends "layout.html" %}
{% block content %}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-bold text-white">Gestão de Produtos</h2>
    <div class="flex items-center gap-3">
      <button onclick="deleteSelected()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-3 py-2 rounded-xl shadow">🗑️ Apagar Selecionados</button>
      <form method="GET" action="/products" class="flex gap-2">
        <input type="hidden" name="store_id" value="{{ selected_store_id }}">
        <input type="text" name="q" value="{{ q }}" placeholder="🔍 Pesquisar..." class="bg-slate-900 border border-slate-800 text-xs text-white rounded-xl px-3 py-2">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-3 py-2 rounded-xl">Buscar</button>
      </form>
    </div>
  </div>

  <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
    <h3 class="text-sm font-bold text-emerald-400">Novo Produto</h3>
    <form action="/products/new" method="POST" class="grid grid-cols-1 md:grid-cols-5 gap-3 text-xs">
      <input type="hidden" name="store_id" value="{{ selected_store_id }}">
      <div>
        <label class="text-slate-400 block mb-1">Código:</label>
        <input type="text" name="code" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
      </div>
      <div>
        <label class="text-slate-400 block mb-1">Nome:</label>
        <input type="text" name="name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
      </div>
      <div>
        <label class="text-slate-400 block mb-1">Preço (R$):</label>
        <input type="number" step="0.01" name="sale_price" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
      </div>
      <div>
        <label class="text-slate-400 block mb-1">Estoque:</label>
        <input type="number" step="1" name="stock_quantity" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
      </div>
      <div class="flex items-end">
        <button type="submit" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs">Cadastrar</button>
      </div>
    </form>
  </div>

  <form id="bulk-form" action="/products/delete-bulk" method="POST">
    <input type="hidden" name="store_id" value="{{ selected_store_id }}">
    <input type="hidden" name="ids" id="selected-ids">
  </form>

  <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
    <table class="w-full text-left text-xs">
      <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
        <tr>
          <th class="p-3 w-8"><input type="checkbox" id="select-all" onclick="toggleAll(this)"></th>
          <th class="p-3">Código</th>
          <th class="p-3">Nome</th>
          <th class="p-3">Preço</th>
          <th class="p-3">Estoque</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-800">
        {% for p in products %}
        <tr class="hover:bg-slate-800/50">
          <td class="p-3"><input type="checkbox" class="item-checkbox" value="{{ p.id }}"></td>
          <td class="p-3 font-mono text-emerald-400">{{ p.code }}</td>
          <td class="p-3 font-medium text-white">{{ p.name }}</td>
          <td class="p-3">R$ {{ "%.2f"|format(p.sale_price) }}</td>
          <td class="p-3 font-bold">{{ p.stock_quantity }}</td>
        </tr>
        {% else %}
        <tr><td colspan="5" class="p-6 text-center text-slate-500">Nenhum produto cadastrado.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<script>
function toggleAll(master) {
  document.querySelectorAll('.item-checkbox').forEach(cb => cb.checked = master.checked);
}
function deleteSelected() {
  let selected = Array.from(document.querySelectorAll('.item-checkbox:checked')).map(cb => cb.value);
  if (selected.length === 0) {
    alert("Selecione ao menos um item!");
    return;
  }
  if (confirm("Deseja apagar os " + selected.length + " produtos selecionados?")) {
    document.getElementById('selected-ids').value = selected.join(',');
    document.getElementById('bulk-form').submit();
  }
}
</script>
{% endblock %}
